name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# The npm package (stdio) is published by hand; this only ships the hosted
# server image to mcp.unblockingapi.com. Two CI runs finishing close together
# must not race their pushes.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  docker-build:
    # This repo is public. `branches: [main]` matches a fork's branch named
    # main too, and workflow_run runs with this repo's secrets, so without the
    # last two checks a fork PR could build, push and deploy its own image.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Tag from the TRIGGERING run's commit, not GITHUB_SHA: for workflow_run
      # events the latter is the head of main at trigger time, which diverges
      # when two pushes land close together — pointing the cluster at a tag that
      # was never pushed (ImagePullBackOff).
      - id: tag
        run: echo "short=${HEAD_SHA::7}" >> "$GITHUB_OUTPUT"
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Cluster nodes are amd64; arm64 is for developer machines.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/unblockingapi/mcp:${{ steps.tag.outputs.short }}
            ghcr.io/unblockingapi/mcp:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  deploy:
    needs: [docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: azure/setup-kubectl@v4

      # Fail HERE, not later. An unset secret writes an empty kubeconfig, and
      # kubectl then falls back to localhost:8080 and reports "connection
      # refused" — which reads like a cluster outage rather than a missing
      # secret, and sent the first debug in entirely the wrong direction.
      - name: Configure kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "::error::KUBE_CONFIG is not set for this repository."
            echo "Set it with:  base64 -i ~/.kube/config | gh secret set KUBE_CONFIG --repo ${{ github.repository }}"
            echo "(An org-level secret must list this repo under its visibility settings.)"
            exit 1
          fi
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          kubectl config current-context >/dev/null

      # KUBE_CONFIG here is the mcp-deployer ServiceAccount (infra/k8s/mcp.yml),
      # which can only read and patch deployment/mcp — not the admin config the
      # private repos use.
      - name: Update deployment image
        run: |
          kubectl -n unblockingapi set image deployment/mcp \
            mcp=ghcr.io/unblockingapi/mcp:${HEAD_SHA::7}
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      # Old pods drain in-flight tool calls (a render can run ~3 min) before
      # exiting, so a rollout takes a few minutes by design.
      - name: Wait for rollout
        run: kubectl rollout status deployment/mcp --namespace=unblockingapi --timeout=600s
